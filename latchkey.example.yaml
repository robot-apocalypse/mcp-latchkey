# mcp-latchkey configuration. Values like ${NAME} are read from the environment.

# Public base URL of the gateway. Services are served at <issuer>/<service>/mcp.
issuer: https://mcp.your-tailnet.ts.net

listen:
  host: 127.0.0.1
  port: 8080

# Where the encrypted state (bound accounts, tokens) is kept.
data_dir: /data

# At least 32 random characters, e.g. `openssl rand -base64 48`.
encryption_key: ${LATCHKEY_ENCRYPTION_KEY}

# The OIDC provider that proves who is signing in. Use a preset, or give
# `issuer` for any OIDC provider (Authentik, Pocket-ID, Keycloak, ...).
# Register <issuer>/idp/callback as the redirect URI with the provider.
idp:
  preset: google
  client_id: ${GOOGLE_CLIENT_ID}
  client_secret: ${GOOGLE_CLIENT_SECRET}

# Optional. Defaults shown.
# oauth:
#   redirect_uris:                 # where codes may be sent (Claude's callbacks)
#     - https://claude.ai/api/mcp/auth_callback
#     - https://claude.com/api/mcp/auth_callback
#   cimd_client_ids:               # client metadata URLs latchkey may fetch
#     - https://claude.ai/oauth/mcp-oauth-client-metadata
#   dynamic_registration: false    # POST /register for non-CIMD clients
#   access_token_ttl: 1h
#   refresh_token_idle_ttl: 90d    # unused this long → sign in again

# People who may sign in. The email must be verified by the IdP; on first
# sign-in the user is bound to that IdP account, so a later email change or a
# recycled address can't take it over (`latchkey users unbind` resets).
users:
  alex:
    email: alex@example.com
  sam:
    email: sam@example.com

# One entry per MCP server. `allow` lists who may use it.
services:
  recipes:
    allow: [alex, sam]
  finances:
    allow: [alex]
