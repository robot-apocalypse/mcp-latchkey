# Example: latchkey behind Tailscale Funnel, with one stdio and one HTTP upstream.
#
#   cp ../latchkey.example.yaml latchkey.yaml   # edit issuer, users, services
#   cp tailscale-serve.json .                   # see docs/setup.md
#   echo "TS_AUTHKEY=..." > .env                # plus LATCHKEY_ENCRYPTION_KEY, GOOGLE_CLIENT_ID/SECRET
#   docker compose up -d
#
# The Tailscale sidecar owns the network namespace: latchkey listens on
# 127.0.0.1:8080 and Funnel publishes it at https://<hostname>.<tailnet>.ts.net.
# Upstreams that join the same namespace are reachable by latchkey on
# 127.0.0.1 and by nothing else.

services:
  tailscale:
    image: tailscale/tailscale:latest
    hostname: mcp
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale-serve.json:/config/serve.json:ro
      - /dev/net/tun:/dev/net/tun
    cap_add: [NET_ADMIN, SYS_MODULE]
    restart: unless-stopped

  latchkey:
    image: ghcr.io/robot-apocalypse/mcp-latchkey:edge
    network_mode: service:tailscale
    depends_on: [tailscale]
    env_file: [.env]
    volumes:
      - ./latchkey.yaml:/config/latchkey.yaml:ro
      - ./data:/data
    restart: unless-stopped

  # An HTTP MCP server with its own auth turned off, reachable only by latchkey.
  # In latchkey.yaml:  my-server: { allow: [...], http: { url: http://127.0.0.1:3101/mcp } }
  # my-server:
  #   image: example/my-mcp-server
  #   network_mode: service:tailscale
  #   environment: [PORT=3101, HOST=127.0.0.1]

volumes:
  tailscale-state:
