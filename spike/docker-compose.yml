# Throwaway Phase 0 spike. `docker compose down -v` when done.
services:
  tailscale:
    image: tailscale/tailscale:v1.96.5
    container_name: latchkey-spike-tailscale
    hostname: latchkey-spike
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale-serve.json:/config/serve.json:ro
      - /dev/net/tun:/dev/net/tun
    cap_add: [NET_ADMIN, SYS_MODULE]
    restart: unless-stopped

  spike:
    build: .
    container_name: latchkey-spike
    network_mode: service:tailscale
    depends_on: [tailscale]
    volumes:
      - ./data:/data
    restart: unless-stopped

volumes:
  tailscale-state:
